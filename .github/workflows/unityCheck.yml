on:
  schedule:
    - cron: "0 13 * * *"   # daily at 13:00 UTC
  workflow_dispatch:        # allows manual runs

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restore the most recent seen-list. A unique save key per run plus the
      # "unity-seen-" restore prefix gives a rolling "latest" state.
      - name: Restore previously-seen jobs
        uses: actions/cache/restore@v4
        with:
          path: seen_jobs.json
          key: unity-seen-${{ github.run_id }}
          restore-keys: |
            unity-seen-

      - name: Check Unity careers for new Montreal early-career software roles
        run: python scripts/check_unity_jobs.py
        # Optional overrides (defaults target Unity / Montreal / software):
        # env:
        #   GREENHOUSE_BOARD: unity3d
        #   LOCATION_KEYWORDS: "montreal,montréal"
        #   EARLY_CAREER_KEYWORDS: "early career,student,intern,graduate,new grad, stagiaire, coop, étudiant"
        #   SOFTWARE_KEYWORDS: "software,developer,développeur,swe,programmer, développement, informatique"

      # Save the updated seen-list even when the check fails (a match = failure),
      # so the same offer won't fail the next run.
      - name: Save seen jobs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_jobs.json
          key: unity-seen-${{ github.run_id }}"

      # Save the updated seen-list even when the check fails (a match = failure),
      # so the same offer won't fail the next run.
      - name: Save seen jobs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_jobs.json
          key: unity-seen-${{ github.run_id }}
