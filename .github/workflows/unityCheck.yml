name: Unity early-careers watch (Montreal)

# Fails when Unity posts a NEW early-career software role in Montreal.
# A failed run triggers GitHub's failure notification: turn on Actions
# notifications (Settings > Notifications > Actions) and Watch the repo.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previously-seen jobs
        uses: actions/cache/restore@v4
        with:
          path: seen_jobs.json
          key: unity-seen-${{ github.run_id }}
          restore-keys: |
            unity-seen-

      - name: Check Unity careers for new Montreal early-career software roles
        run: python Scripts/check_unity_jobs.py
        env:
          EARLY_CAREER_KEYWORDS: "early career,student,intern,internship,co-op,coop,new grad,new graduate,graduate,apprentice,campus,junior,stagiaire,stage,étudiant,étudiante,etudiant,alternance,apprenti,apprentie,débutant,débutante,jeune diplômé,diplômé,diplômée"
          SOFTWARE_KEYWORDS: "software,developer,software engineer,swe,programmer,programming,logiciel,informatique,développeur,développeuse,developpeur,développement,programmeur,génie logiciel,génie informatique,engineer,engineering,ingénieur,ingénieure,ingenieur"

      - name: Save seen jobs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_jobs.json
          key: unity-seen-${{ github.run_id }}
